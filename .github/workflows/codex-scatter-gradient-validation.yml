name: Candle scatter destination gradient CPU validation
on:
  push:
    branches: [codex/validate-scatter-destination-gradients]
permissions:
  contents: read
env:
  CANDIDATE_COMMIT: fe524d24e753bb61ae63dbda2158cfb5e3341bd1
  BASE_PIN: cfcbd7186d13271843ce7eb41d25659bd0835850
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  HF_HUB_OFFLINE: '1'
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: peterolkhov/candle
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
          fetch-depth: 2
      - name: Exact before lock payload part 1
        run: printf '%s' '' > "$RUNNER_TEMP/before-lock.b64"
      - name: Exact before lock payload part 2
        run: printf '%s' '' >> "$RUNNER_TEMP/before-lock.b64"
      - name: Exact before lock payload part 3
        run: printf '%s' '' >> "$RUNNER_TEMP/before-lock.b64"
      - name: Exact before lock payload part 4
        run: printf '%s' '' >> "$RUNNER_TEMP/before-lock.b64"
      - name: Exact before lock payload part 5
        run: printf '%s' '' >> "$RUNNER_TEMP/before-lock.b64"
      - name: Pin full source, exact production diff, toolchain and dependency lock
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$BASE_PIN"
          test -z "$(git status --porcelain)"
          python3 - <<'SOURCE_GUARD'
          import base64,hashlib,json,pathlib,subprocess,zlib
          manifest = {'repository': 'huggingface/candle', 'base_pin': 'cfcbd7186d13271843ce7eb41d25659bd0835850', 'validation_status': 'prepared; native after gates pending root execution', 'files': [{'path': 'candle-core/src/backprop.rs', 'original': {'bytes': 40355, 'git_blob_sha1': '7dc4114758c4db82449bb52a2de1ed02bf0e5b50', 'content_sha256': 'd83f4fdd46286c5ef168c562722e2f70e5fa48e6def9844be801a837b3b11f56'}, 'after': {'bytes': 40298, 'git_blob_sha1': '08de8f2a129710a5d1579e0504406c63c5370151', 'content_sha256': 'acf45b9674013ef9ccf8146baddcd1072eb81c13adfe1c1d9081029e81581f81'}}, {'path': 'candle-core/tests/grad_tests.rs', 'original': {'bytes': 21003, 'git_blob_sha1': '7989613e6768d426bdc6002bf00cb7fce23b3347', 'content_sha256': '65c1d2fa75e4f073bb2de742f372f299641f68617ed222b770573a4a17930e16'}, 'after': {'bytes': 25275, 'git_blob_sha1': '654c0667ae3d7cfe0c9ac9578ca4beab9816272d', 'content_sha256': '4211c9b5868d70be78884b5c8444ebe10b63df668b21483144d7783e69a3a29f'}}], 'unchanged_root_probe': {'bytes': 4820, 'git_blob_sha1': '634ddb8c3fb39253c381ca26cccfc0a6036c6fb1', 'content_sha256': '523c5ea8e0bca22377e93ed30ac31a04178139cbe3a3696503848975e436b1c5'}, 'same_resolved_lock': {'bytes': 201508, 'git_blob_sha1': 'f04766f2978d542f6ea92d8dbe2a2007d452fd60', 'content_sha256': 'f766cfea438c2d466ff09a07710343cd3ef95b8544636061e070405cdea99e2c'}}
          actual = subprocess.check_output(['git','diff','--name-only',manifest['base_pin'],'HEAD'],text=True).splitlines()
          assert sorted(actual) == sorted(item['path'] for item in manifest['files']),actual
          for item in manifest['files']:
              before = subprocess.check_output(['git','show',manifest['base_pin']+':'+item['path']])
              after = pathlib.Path(item['path']).read_bytes()
              assert hashlib.sha256(before).hexdigest() == item['original']['content_sha256'],item
              assert hashlib.sha256(after).hexdigest() == item['after']['content_sha256'],item
          lock=zlib.decompress(base64.b64decode(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'before-lock.b64').read_text()))
          assert hashlib.sha256(lock).hexdigest() == manifest['same_resolved_lock']['content_sha256']
          pathlib.Path('Cargo.lock').write_bytes(lock)
          probe=base64.b64decode('')
          assert hashlib.sha256(probe).hexdigest() == manifest['unchanged_root_probe']['content_sha256']
          pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'numeric41_probe.rs').write_bytes(probe)
          print('CANDLE_SOURCE_AND_EXACT_LOCK_GUARDS=PASS')
          SOURCE_GUARD
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc +1.99.1 --version
          cargo +1.99.1 --version
          df -h
      - name: Workspace formatting on only the candidate source
        run: cargo +1.99.1 fmt --all -- --check
      - name: Native RED with original owning backprop and unchanged root probe
        run: |
          test ! -e candle-core/tests/numeric41_probe.rs
          cp "$RUNNER_TEMP/numeric41_probe.rs" candle-core/tests/numeric41_probe.rs
          cp candle-core/src/backprop.rs "$RUNNER_TEMP/after-backprop.rs"
          trap 'cp "$RUNNER_TEMP/after-backprop.rs" candle-core/src/backprop.rs' EXIT
          git show "$BASE_PIN:candle-core/src/backprop.rs" > candle-core/src/backprop.rs
          set +e
          cargo +1.99.1 test --locked -p candle-core --test numeric41_probe -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          python3 - <<'RED_GUARD'
          import os,pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'native-red.log').read_text()
          assert 'test result: FAILED. 0 passed; 2 failed;' in text,text
          assert 'add=false: init_grad=[1.0, 2.0, 4.0]' in text,text
          assert 'add=true: init_grad=[0.0, 0.0, 0.0]' in text,text
          assert 'partial add=true: backward_error=' in text,text
          print('CANDLE_ORIGINAL_OWNER_NATIVE_RED=PASS')
          RED_GUARD
      - name: Native GREEN with unchanged root probe and new regression tests
        run: |
          cargo +1.99.1 test --locked -p candle-core --test numeric41_probe -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-green.log"
          cargo +1.99.1 test --locked -p candle-core --test grad_tests scatter -- --nocapture
          python3 - <<'GREEN_GUARD'
          import hashlib,os,pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'native-green.log').read_text()
          assert 'test result: ok. 2 passed; 0 failed;' in text,text
          assert 'add=false: init_grad=[0.0, 0.0, 0.0]' in text,text
          assert 'add=true: init_grad=[1.0, 2.0, 4.0]' in text,text
          assert 'partial add=false: init_grad=[1.0, 0.0, 4.0]' in text,text
          assert 'partial add=true: init_grad=[1.0, 2.0, 4.0]' in text,text
          assert hashlib.sha256(pathlib.Path('candle-core/tests/numeric41_probe.rs').read_bytes()).hexdigest() == '523c5ea8e0bca22377e93ed30ac31a04178139cbe3a3696503848975e436b1c5'
          print('CANDLE_UNCHANGED_ROOT_PROBE_NATIVE_GREEN=PASS')
          GREEN_GUARD
          rm candle-core/tests/numeric41_probe.rs
          test -z "$(git diff --name-only)"
      - name: Whole core CPU tests, existing gradient and tensor suites
        run: |
          cargo +1.99.1 test --locked -p candle-core --no-run
          CARGO_NET_OFFLINE=true cargo +1.99.1 test --locked --offline -p candle-core
      - name: Core clippy including tests, examples and benches
        run: cargo +1.99.1 clippy --locked -p candle-core --tests --examples --benches -- -D warnings
      - name: Official workspace CPU all-target compile check
        run: cargo +1.99.1 check --locked --workspace --all-targets
      - name: Workspace CPU tests; skip the source-confirmed live Hub dataset test
        run: |
          cargo +1.99.1 test --locked --workspace --lib --bins --tests --no-run
          CARGO_NET_OFFLINE=true cargo +1.99.1 test --locked --offline --workspace --lib --bins --tests -- --skip hub::tests::test_dataset
      - name: Workspace CPU doctests excluding two live Hub dataset examples
        run: |
          CARGO_NET_OFFLINE=true cargo +1.99.1 test --locked --offline --workspace --exclude candle-datasets --doc
      - name: Official workspace clippy
        run: cargo +1.99.1 clippy --locked --workspace --tests --examples --benches -- -D warnings
      - name: Final source and dependency guards
        if: always()
        run: |
          test -z "$(git diff --name-only)"
          echo 'f766cfea438c2d466ff09a07710343cd3ef95b8544636061e070405cdea99e2c  Cargo.lock' | sha256sum --check
          df -h
